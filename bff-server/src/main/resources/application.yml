spring:
  application:
    name: bff-server
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8083}
  servlet:
    session:
      cookie:
        name: __Host-SESSION
        secure: true
        http-only: true
        same-site: Lax
        path: /

bff-server:
  # This server's own externally reachable base URL — what the browser can hit. Used
  # to build the OAuth2 redirect_uri ({external-location}/api/auth/callback), which
  # must byte-for-byte match a registered redirect_uri in auth-server's
  # oauth2_registered_client table.
  external-location: ${BFF_SERVER_EXTERNAL_LOCATION:http://localhost:8083}

auth-server:
  # Reachable from inside the deployment network; used by the server-to-server
  # RestClient. In docker this is http://auth-server:9000.
  internal-location: ${AUTH_SERVER_INTERNAL_LOCATION:http://localhost:9000}
  # Reachable from outside (i.e. by the user's browser); used in redirects the
  # browser must follow, such as the authorize kick-off. In docker the internal
  # hostname doesn't resolve for the browser, so this stays localhost:9000 there.
  external-location: ${AUTH_SERVER_EXTERNAL_LOCATION:http://localhost:9000}

web:
  client:
    # Default to the public PKCE client; can be overridden for legacy flows/tests.
    id: ${WEB_CLIENT_ID:WEB_CLIENT_PKCE}
    # Optional for public PKCE clients (empty by default). Legacy confidential clients
    # can still provide this to use client_secret_basic.
    secret: ${WEB_CLIENT_SECRET:}
    origin: ${WEB_CLIENT_ORIGIN:http://localhost:3000}

token-store:
  # TTL applied to stored refresh tokens. The refresh token is opaque (no readable
  # exp), so this mirrors auth-server's settings.token.refresh-token-time-to-live.
  refresh-token-ttl-seconds: ${REFRESH_TOKEN_TTL_SECONDS:3600}

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8070/eureka/}

info:
  app:
    name: ${spring.application.name}
    description: Backend-for-frontend service for roots-app
    version: @project.version@

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,shutdown
  endpoint:
    shutdown:
      access: unrestricted
