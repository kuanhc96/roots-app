name: Simple Resource Server CI

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'simple-resource-server/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        working-directory: simple-resource-server
        run: mvn test

      - name: Build Docker image
        working-directory: simple-resource-server
        run: mvn clean compile jib:dockerBuild -DskipTests -Djib.to.image=${{ secrets.DOCKERHUB_USERNAME }}/simple-resource-server:ci

      - name: Start services
        run: docker compose up -d --wait simple-resource-server
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          SIMPLE_RESOURCE_SERVER_TAG: ci
          SPRING_PROFILES_ACTIVE: test

      - name: Verify simple-resource-server health
        run: curl --fail --silent http://localhost:8081/actuator/health | grep -q UP

      - name: Stop services
        if: always()
        run: docker compose down
