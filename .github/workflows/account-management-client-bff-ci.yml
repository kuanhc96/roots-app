name: Account Management Client BFF CI

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'account-management-client-bff/src/**'
      - 'account-management-client-bff/frontend/**'
      - 'account-management-client-bff/pom.xml'
      - 'account-management-client-bff-ci.yml'
      - 'docker-compose.yml'

jobs:
  build-and-healthcheck:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      ACCOUNT_MANAGEMENT_CLIENT_BFF_TAG: ci
      SPRING_PROFILES_ACTIVE: test
      WEB_CLIENT_SECRET: secret
      ACCOUNT_MANAGEMENT_CLIENT_SECRET: secret
      MYSQL_AUTH_SERVER_ROOT_USERNAME: ${{ secrets.MYSQL_AUTH_SERVER_ROOT_USERNAME }}
      MYSQL_AUTH_SERVER_ROOT_PASSWORD: ${{ secrets.MYSQL_AUTH_SERVER_ROOT_PASSWORD }}
      SPRING_MAIL_USERNAME: ${{ secrets.SPRING_MAIL_USERNAME }}
      SPRING_MAIL_PASSWORD: ${{ secrets.SPRING_MAIL_PASSWORD }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Dependency services use published :latest images, including private repositories.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Maven generates the embedded Nuxt SPA, runs the unit tests and builds the jar.
      - name: Build account-management-client-bff frontend, jar and unit tests
        working-directory: account-management-client-bff
        run: mvn package

      - name: Build account-management-client-bff image
        working-directory: account-management-client-bff
        run: mvn jib:dockerBuild -Djib.to.image=${{ secrets.DOCKERHUB_USERNAME }}/account-management-client-bff:ci

      # Start after gateway-server, auth-server and shared Redis; compose --wait
      # blocks until the dependency chain and this service are healthy.
      - name: Start services
        run: docker compose up -d --wait account-management-client-bff

      - name: Verify account-management-client-bff health
        run: curl --fail --silent http://localhost:8084/actuator/health | grep -q UP

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --no-color
