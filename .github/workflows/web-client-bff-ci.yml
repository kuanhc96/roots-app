name: Web Client BFF CI

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'web-client-bff/src/**'
      - 'web-client-bff/frontend/**'
      - 'web-client-bff/pom.xml'
      - '.github/workflows/web-client-bff-ci.yml'
      - 'docker-compose.yml'

jobs:
  integration-test:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      WEB_CLIENT_BFF_TAG: ci
      SPRING_PROFILES_ACTIVE: test
      WEB_CLIENT_SECRET: secret
      MYSQL_AUTH_SERVER_ROOT_USERNAME: ${{ secrets.MYSQL_AUTH_SERVER_ROOT_USERNAME }}
      MYSQL_AUTH_SERVER_ROOT_PASSWORD: ${{ secrets.MYSQL_AUTH_SERVER_ROOT_PASSWORD }}
      SPRING_MAIL_USERNAME: ${{ secrets.SPRING_MAIL_USERNAME }}
      SPRING_MAIL_PASSWORD: ${{ secrets.SPRING_MAIL_PASSWORD }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Dependency services use published :latest images, including private repositories.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Maven also generates the embedded Nuxt SPA and compiles the test classes.
      - name: Build web-client-bff frontend, jar and test classes
        working-directory: web-client-bff
        run: mvn package -DskipTests

      - name: Build web-client-bff image
        working-directory: web-client-bff
        run: mvn jib:dockerBuild -Djib.to.image=${{ secrets.DOCKERHUB_USERNAME }}/web-client-bff:ci

      # The app waits for gateway-server, auth-server and shared Redis to be healthy.
      - name: Start services
        run: docker compose up -d --wait web-client-bff

      - name: Wait for gateway resource route readiness
        run: |
          for i in {1..60}; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://localhost:8080/roots-app/simple-resource-server/role/guest)
            if [ "$status" = "401" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for gateway to route requests to simple-resource-server"
          exit 1

      # The test client runs on the host and hits the published port (localhost:8083).
      - name: Run integration tests
        working-directory: web-client-bff
        run: mvn surefire:test '-Dtest=%regex[.*integration.*]'

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --no-color
