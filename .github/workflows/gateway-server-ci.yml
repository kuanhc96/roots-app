name: Gateway Server CI

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'gateway-server/src/**'
      - 'gateway-server/pom.xml'

jobs:
  build-and-healthcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # bff-server and auth-server are unchanged dependencies for this workflow (the paths
      # filter means a triggering PR only touched gateway-server), so pull their published
      # :latest images rather than rebuilding them. These are private repos, so authenticate.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # gateway-server is the subject of this PR, so build its image from the PR source.
      # package -DskipTests compiles main + test sources and produces the jar; jib:dockerBuild
      # then builds the image straight into the local Docker daemon (no registry push).
      - name: Build gateway-server jar
        working-directory: gateway-server
        run: mvn package -DskipTests

      - name: Build gateway-server image
        working-directory: gateway-server
        run: mvn jib:dockerBuild -Djib.to.image=${{ secrets.DOCKERHUB_USERNAME }}/gateway-server:ci

      # Bring up bff-server-redis + auth-server-db + auth-server + bff-server + gateway-server
      # on the shared docker network. depends_on chains in the dependencies; gateway-server uses
      # the local :ci image. --wait blocks until all are healthy — the gateway-server healthcheck
      # hits /actuator/health.
      - name: Start services
        run: docker compose up -d --wait gateway-server
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          GATEWAY_SERVER_TAG: ci
          SPRING_PROFILES_ACTIVE: test
          # Matches the {noop}secret WEB_CLIENT seed in create_client_table.sql (already
          # public in the checked-in SQL, so not a GitHub secret).
          WEB_CLIENT_SECRET: secret
          MYSQL_AUTH_SERVER_ROOT_USERNAME: ${{ secrets.MYSQL_AUTH_SERVER_ROOT_USERNAME }}
          MYSQL_AUTH_SERVER_ROOT_PASSWORD: ${{ secrets.MYSQL_AUTH_SERVER_ROOT_PASSWORD }}
          SPRING_MAIL_USERNAME: ${{ secrets.SPRING_MAIL_USERNAME }}
          SPRING_MAIL_PASSWORD: ${{ secrets.SPRING_MAIL_PASSWORD }}

      - name: Verify gateway-server health
        run: curl --fail --silent http://localhost:8080/actuator/health | grep -q UP

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --no-color
