name: Gateway Server CI

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'gateway-server/src/**'
      - 'gateway-server/pom.xml'

jobs:
  build-and-healthcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Fast fail gate: run unit tests before any build/image work.
      # If this step fails, GitHub Actions stops the job and no build proceeds.
      - name: Run unit tests
        working-directory: gateway-server
        run: mvn test -Dtest="GatewayServerApplicationTests,AccessTokenFilterTest,RefreshTokenFilterTest"

      # Published dependency images include private repositories.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # gateway-server is the subject of this PR, so build its image from the PR source.
      # package -DskipTests compiles main + test sources and produces the jar; jib:dockerBuild
      # then builds the image straight into the local Docker daemon (no registry push).
      - name: Build gateway-server jar
        working-directory: gateway-server
        run: mvn package -DskipTests

      - name: Build gateway-server image
        working-directory: gateway-server
        run: mvn jib:dockerBuild -Djib.to.image=${{ secrets.DOCKERHUB_USERNAME }}/gateway-server:ci

      # Build the migrated login fixture locally so CI does not need a first CD release.
      - name: Build web-client-bff login fixture
        working-directory: web-client-bff
        run: |
          mvn package -DskipTests
          mvn jib:dockerBuild -Djib.to.image=${{ secrets.DOCKERHUB_USERNAME }}/web-client-bff:ci

      # Bring up web-client-bff after gateway-server and its resource dependencies
      # on the shared docker network. depends_on chains in dependencies; gateway-server uses
      # the local :ci image. --wait blocks until all are healthy — the gateway-server healthcheck
      # hits /actuator/health.
      - name: Start services
        run: docker compose up -d --wait web-client-bff
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          GATEWAY_SERVER_TAG: ci
          WEB_CLIENT_BFF_TAG: ci
          SPRING_PROFILES_ACTIVE: test
          # Matches the {noop}secret WEB_CLIENT seed in create_client_table.sql (already
          # public in the checked-in SQL, so not a GitHub secret).
          WEB_CLIENT_SECRET: secret
          MYSQL_AUTH_SERVER_ROOT_USERNAME: ${{ secrets.MYSQL_AUTH_SERVER_ROOT_USERNAME }}
          MYSQL_AUTH_SERVER_ROOT_PASSWORD: ${{ secrets.MYSQL_AUTH_SERVER_ROOT_PASSWORD }}
          SPRING_MAIL_USERNAME: ${{ secrets.SPRING_MAIL_USERNAME }}
          SPRING_MAIL_PASSWORD: ${{ secrets.SPRING_MAIL_PASSWORD }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: Verify gateway-server health
        run: curl --fail --silent http://localhost:8080/actuator/health | grep -q UP

      # compose --wait ensures containers are healthy, but integration tests need all
      # discovery participants registered in Eureka before gateway routing is reliable.
      - name: Wait for Eureka app registrations
        run: |
          for i in {1..60}; do
            apps_json=$(curl --silent --fail -H "Accept: application/json" http://localhost:8070/eureka/apps || true)
            compact_json=$(echo "$apps_json" | tr -d '\n\r[:space:]')
            if echo "$compact_json" | grep -q '"name":"GATEWAY-SERVER"' \
              && echo "$compact_json" | grep -q '"name":"SIMPLE-RESOURCE-SERVER"' \
              && echo "$compact_json" | grep -q '"name":"ACCOUNT-MANAGEMENT"'; then
              echo "All required apps are registered in Eureka."
              exit 0
            fi
            echo "Attempt $i: waiting for GATEWAY-SERVER, SIMPLE-RESOURCE-SERVER, ACCOUNT-MANAGEMENT in /eureka/apps"
            sleep 2
          done
          sleep 4
          echo "Timed out waiting for required Eureka app registrations"
          exit 1

      - name: Wait for gateway resource route readiness
        run: |
          for i in {1..60}; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://localhost:8080/roots-app/simple-resource-server/role/guest)
            if [ "$status" = "401" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for gateway to route requests to simple-resource-server"
          exit 1

      # Integration tests run after the docker network/services are up.
      - name: Run integration tests
        working-directory: gateway-server
        run: mvn surefire:test -Dtest="GuestRoleGatewayIntegrationTest"

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --no-color
