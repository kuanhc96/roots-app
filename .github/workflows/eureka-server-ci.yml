name: Eureka Server CI

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'eureka-server/src/**'
      - 'eureka-server/pom.xml'

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build eureka-server jar
        working-directory: eureka-server
        run: mvn package -DskipTests

      - name: Build eureka-server image
        working-directory: eureka-server
        run: mvn jib:dockerBuild -Djib.to.image=${{ secrets.DOCKERHUB_USERNAME }}/eureka-server:ci

      # Start only eureka-server on the shared docker-compose network. This keeps
      # eureka-server as the first service started in that network for this CI flow.
      - name: Start eureka-server
        run: docker compose up -d --wait eureka-server
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          EUREKA_SERVER_TAG: ci
          SPRING_PROFILES_ACTIVE: test

      - name: Smoke test eureka-server health
        run: curl --fail --silent http://localhost:8070/actuator/health | grep -q UP

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --no-color
