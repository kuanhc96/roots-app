name: Account Management BFF CI

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'account-management-bff/src/**'
      - 'account-management-bff/pom.xml'

jobs:
  build-and-healthcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # auth-server is an unchanged dependency for this workflow (the paths filter means a
      # triggering PR only touched account-management-bff), so pull its published :latest
      # image rather than rebuilding it. Private repos require Docker Hub auth.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # account-management-bff is the subject of this PR, so build the jar and image from
      # the PR source. The image is built into the local Docker daemon (no registry push).
      - name: Build account-management-bff jar
        working-directory: account-management-bff
        run: mvn package -DskipTests

      - name: Build account-management-bff image
        working-directory: account-management-bff
        run: mvn jib:dockerBuild -Djib.to.image=${{ secrets.DOCKERHUB_USERNAME }}/account-management-bff:ci

      # Bring up Redis + DB + auth-server + account-management-bff on the shared docker
      # network. depends_on chains in dependencies; --wait blocks until all are healthy.
      - name: Start services
        run: docker compose up -d --wait account-management-bff
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          ACCOUNT_MANAGEMENT_BFF_TAG: ci
          SPRING_PROFILES_ACTIVE: test
          # Matches the {noop}secret ACCOUNT_MANAGEMENT_CLIENT seed in create_client_table.sql.
          ACCOUNT_MANAGEMENT_CLIENT_SECRET: secret
          MYSQL_AUTH_SERVER_ROOT_USERNAME: ${{ secrets.MYSQL_AUTH_SERVER_ROOT_USERNAME }}
          MYSQL_AUTH_SERVER_ROOT_PASSWORD: ${{ secrets.MYSQL_AUTH_SERVER_ROOT_PASSWORD }}
          SPRING_MAIL_USERNAME: ${{ secrets.SPRING_MAIL_USERNAME }}
          SPRING_MAIL_PASSWORD: ${{ secrets.SPRING_MAIL_PASSWORD }}

      - name: Verify account-management-bff health
        run: curl --fail --silent http://localhost:8084/actuator/health | grep -q UP

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --no-color
