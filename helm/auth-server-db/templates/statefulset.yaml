apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "auth-server-db.fullname" . }}
  labels:
    {{- include "auth-server-db.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "auth-server-db.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "auth-server-db.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "auth-server-db.labels" . | nindent 8 }}
    spec:
      containers:
        - name: mysql
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: mysql
              containerPort: {{ .Values.mysql.tcpPort }}
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mysql.existingSecret | default (include "auth-server-db.fullname" .) }}
                  key: {{ ternary .Values.mysql.existingSecretPasswordKey "mysql-root-password" (ne .Values.mysql.existingSecret "") }}
            - name: MYSQL_TCP_PORT
              value: {{ .Values.mysql.tcpPort | quote }}
            - name: MYSQL_DATABASE
              value: {{ .Values.mysql.database | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: data
              mountPath: /var/lib/mysql
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - "127.0.0.1"
                - --port={{ .Values.mysql.tcpPort }}
                - -uroot
                - -p$(MYSQL_ROOT_PASSWORD)
            initialDelaySeconds: {{ .Values.healthCheck.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.periodSeconds }}
            timeoutSeconds: {{ .Values.healthCheck.timeoutSeconds }}
            failureThreshold: {{ .Values.healthCheck.failureThreshold }}
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - "127.0.0.1"
                - --port={{ .Values.mysql.tcpPort }}
                - -uroot
                - -p$(MYSQL_ROOT_PASSWORD)
            initialDelaySeconds: {{ .Values.healthCheck.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.periodSeconds }}
            timeoutSeconds: {{ .Values.healthCheck.timeoutSeconds }}
            failureThreshold: {{ .Values.healthCheck.failureThreshold }}
      volumes:
        - name: initdb
          configMap:
            name: {{ include "auth-server-db.fullname" . }}-initdb
{{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
{{- end }}
{{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
{{- end }}
