spring:
  application:
    name: web-client-bff
  security:
    oauth2:
      client:
        registration:
          web-client-registration:
            client-id: ${web.client.id}
            client-secret: ${web.client.secret}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_basic
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - WEB_CLIENT_READ
        provider:
          web-client-registration:
            issuer-uri: ${AUTH_SERVER_ISSUER:${auth-server.internal-location}}
            authorization-uri: ${auth-server.external-location}/oauth2/authorize
            token-uri: ${auth-server.internal-location}/oauth2/token
            jwk-set-uri: ${auth-server.internal-location}/oauth2/jwks

server:
  port: ${SERVER_PORT:8083}
  servlet:
    session:
      persistent: false
      cookie:
        name: __Host-SESSION
        secure: true
        http-only: true
        same-site: Lax
        path: /

bff-server:
  # Default origin for browser-facing login and logout redirects.
  # Spring derives the callback URI from the request's public base URL.
  external-location: ${BFF_SERVER_EXTERNAL_LOCATION:http://localhost:8083}

auth-server:
  # Reachable from inside the deployment network; used by the server-to-server
  # RestClient. In docker this is http://auth-server:9000.
  internal-location: ${AUTH_SERVER_INTERNAL_LOCATION:http://localhost:9000}
  # Reachable from outside (i.e. by the user's browser); used in redirects the
  # browser must follow, such as the authorize kick-off. In docker the internal
  # hostname doesn't resolve for the browser, so this stays localhost:9000 there.
  external-location: ${AUTH_SERVER_EXTERNAL_LOCATION:http://localhost:9000}

gateway-server:
  # Reachable from inside the deployment network; the bff proxies simple-resource-server
  # calls through the gateway's /roots-app/simple-resource-server route with the
  # session's access token attached as a bearer header.
  internal-location: ${GATEWAY_SERVER_INTERNAL_LOCATION:http://localhost:8080}

web:
  client:
    # Default to the confidential PKCE client; can be overridden for legacy flows/tests.
    id: ${WEB_CLIENT_ID:WEB_CLIENT_PKCE}
    # Required: WEB_CLIENT_PKCE is confidential and authenticates with client_secret_basic.
    secret: ${WEB_CLIENT_SECRET}
    # The SPA is served by this app, so callback and logout return to the same origin.
    origin: ${WEB_CLIENT_ORIGIN:${bff-server.external-location}}

info:
  app:
    name: ${spring.application.name}
    description: Backend-for-frontend service for roots-app
    version: @project.version@

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,shutdown
  endpoint:
    shutdown:
      access: unrestricted
