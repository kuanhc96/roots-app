spring:
  application:
    name: account-management-client-bff
  security:
    oauth2:
      client:
        registration:
          account-management-pkce-registration:
            provider: auth-server-provider
            client-id: ACCOUNT_MANAGEMENT_CLIENT
            client-secret: secret
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8084/login/oauth2/code/account-management-pkce-registration
            scope: openid,ACCOUNT_MANAGEMENT_CLIENT
        provider:
          auth-server-provider:
            authorization-uri: http://localhost:9000/oauth2/authorize
            token-uri: http://localhost:9000/oauth2/token
            jwk-set-uri: http://localhost:9000/oauth2/jwks
            user-info-uri: http://localhost:9000/connect/userinfo
            user-name-attribute: sub

auth-server:
  external-location: http://localhost:9000

account-management:
  location: http://localhost:8082
  client:
    id: ACCOUNT_MANAGEMENT_CLIENT
    secret: secret

